name: Mirror to Pabi691/bmms (push-triggered)

# Runs on every push to main. Only does anything when executing inside
# joydipghosh55-jpg/bmms (the `if:` guard below) — this same file also
# exists in Pabi691/bmms via the dual-push setup, but there's nothing
# for it to do there, so it no-ops instead of failing.
#
# Builds first as a safety gate: if the code doesn't build, nothing gets
# pushed to Pabi691/bmms, so a broken push here never reaches the live
# Vercel deploy automatically.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  mirror:
    if: github.repository == 'joydipghosh55-jpg/bmms'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Without this, checkout persists its own github.com credential
          # (scoped to this repo only) into git config, which silently
          # overrides the PABI_REPO_TOKEN embedded in the push URL below
          # and makes the later push fail as github-actions[bot] instead.
          persist-credentials: false

      - name: Install dependencies
        run: npm install

      - name: Build (safety gate — nothing pushes if this fails)
        run: npm run build

      - name: Push to Pabi691/bmms (triggers the live Vercel deploy)
        run: git push "https://x-access-token:${{ secrets.PABI_REPO_TOKEN }}@github.com/Pabi691/bmms.git" HEAD:main
